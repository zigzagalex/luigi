name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Job permissions are set below. The production environment should be limited
# to the main branch in the repository settings.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      shop: ${{ steps.filter.outputs.shop }}
      admin: ${{ steps.filter.outputs.admin }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo api=true >> "$GITHUB_OUTPUT"
            echo shop=true >> "$GITHUB_OUTPUT"
            echo admin=true >> "$GITHUB_OUTPUT"
            echo deploy=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$SHA")
          api=false
          shop=false
          admin=false
          deploy=false
          printf '%s\n' "$files" | grep -q '^luigi-mvp/api/' && api=true || true
          printf '%s\n' "$files" | grep -q '^luigi-mvp/web-shop/' && shop=true || true
          printf '%s\n' "$files" | grep -q '^luigi-mvp/web-admin/' && admin=true || true
          if [ "$api" = true ] || [ "$shop" = true ] || [ "$admin" = true ]; then
            deploy=true
          fi
          printf '%s\n' "$files" | grep -Eq '^luigi-mvp/(docker-compose\.yml|Caddyfile|deploy/|seaweed/)' && deploy=true || true
          {
            echo "api=$api"
            echo "shop=$shop"
            echo "admin=$admin"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')/luigi-api" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: luigi-mvp/api
          file: luigi-mvp/api/Dockerfile
          target: api
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=luigi-api
          cache-to: type=gha,mode=max,scope=luigi-api

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Sign image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  build-shop:
    needs: changes
    if: needs.changes.outputs.shop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')/luigi-web-shop" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: luigi-mvp/web-shop
          file: luigi-mvp/web-shop/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: NEXT_PUBLIC_SHOP_ID=1
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=luigi-web-shop
          cache-to: type=gha,mode=max,scope=luigi-web-shop

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Sign image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  build-admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')/luigi-web-admin" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: luigi-mvp/web-admin
          file: luigi-mvp/web-admin/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: NEXT_PUBLIC_SHOP_ID=1
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=luigi-web-admin
          cache-to: type=gha,mode=max,scope=luigi-web-admin

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Sign image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  deploy:
    needs: [changes, build-api, build-shop, build-admin]
    if: >-
      always() &&
      needs.changes.outputs.deploy == 'true' &&
      contains(fromJSON('["success","skipped"]'), needs.build-api.result) &&
      contains(fromJSON('["success","skipped"]'), needs.build-shop.result) &&
      contains(fromJSON('["success","skipped"]'), needs.build-admin.result)
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Roll out the signed sha
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          TS_SSH_HOST: ${{ secrets.TS_SSH_HOST }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "deploy@${TS_SSH_HOST}" "$SHA"
