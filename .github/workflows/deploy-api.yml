name: Deploy API (Cloud Run)

on:
  push:
    branches: [ "main" ]
    paths:
      - "luigi-mvp/api/**"                 # <-- monorepo path
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO }}

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Who am I (debug)
        run: |
          echo "WIF provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          echo "Target SA    : ${{ secrets.GCP_DEPLOY_SA }}"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev -q

      - name: Build image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPO}/api:${GITHUB_SHA::7}"
          docker build -t "$IMAGE" ./luigi-mvp/api            # <-- build context fixed
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run (API)
        run: |
          gcloud run deploy api \
            --image="$IMAGE" \
            --region="${GCP_REGION}" \
            --service-account="run-api@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
