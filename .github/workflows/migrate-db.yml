name: Migrate DB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'luigi/luigi-mvp/api/migrations**'

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Install Cloud SQL Auth Proxy
        run: |
          curl -sSL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.4/cloud-sql-proxy.linux.amd64 -o cloud-sql-proxy
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Proxy as run-api (via impersonation)
        env:
          INSTANCE_CONNECTION_NAME: ${{ secrets.INSTANCE_CONNECTION_NAME }}
          RUN_API_SA_EMAIL: ${{ secrets.RUN_API_SA_EMAIL }}
        run: |
          ./cloud-sql-proxy "$INSTANCE_CONNECTION_NAME" \
            --port 5432 \
            --impersonate-service-account="${RUN_API_SA_EMAIL}" &
          sleep 5

      - name: Install goose (prebuilt binary)
        run: |
          curl -sSL https://github.com/pressly/goose/releases/latest/download/goose_Linux_x86_64.tar.gz -o goose.tar.gz
          tar -xzf goose.tar.gz goose
          chmod +x goose


      - name: Fetch DB migrator password via run-api impersonation
        env:
          RUN_API_SA_EMAIL: ${{ secrets.RUN_API_SA_EMAIL }}
        run: |
          PW=$(gcloud secrets versions access latest \
              --secret=migrator \
              --impersonate-service-account="${RUN_API_SA_EMAIL}")
          echo "DB_PASSWORD=$PW" >> $GITHUB_ENV
      
      - name: Run migrations with goose
        env:
          DB_USER: migrator
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          export DATABASE_URL="postgres://${DB_USER}:${DB_PASSWORD}@127.0.0.1:5432/${DB_NAME}?sslmode=disable"
          ./goose -dir ./luigi/luigi-mvp/api/migrations postgres "$DATABASE_URL" up

      - name: Show goose status
        if: always()
        env:
          DB_USER: migrator
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          export DATABASE_URL="postgres://${DB_USER}:${DB_PASSWORD}@127.0.0.1:5432/${DB_NAME}?sslmode=disable"
          ./goose -dir ./luigi/luigi-mvp/api/migrations postgres "$DATABASE_URL" status
