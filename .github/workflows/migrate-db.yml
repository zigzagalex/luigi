name: Migrate DB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'luigi-mvp/api/migrations/**'

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Install Cloud SQL Auth Proxy
        run: |
          curl -sSL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.4/cloud-sql-proxy.linux.amd64 -o cloud-sql-proxy
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Proxy as run-api (via impersonation)
        env:
          INSTANCE_CONNECTION_NAME: ${{ secrets.INSTANCE_CONNECTION_NAME }}
          RUN_API_SA_EMAIL: ${{ secrets.RUN_API_SA_EMAIL }}
        run: |
          ./cloud-sql-proxy "$INSTANCE_CONNECTION_NAME" \
            --port 5432 \
            --impersonate-service-account="${RUN_API_SA_EMAIL}" &
          sleep 5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      # Install goose and run it
      - name: Run migrations with goose (install via go install)
        env:
          DB_USER: migrator
          DB_NAME: ${{ secrets.DB_NAME }}
          RUN_API_SA_EMAIL: ${{ secrets.RUN_API_SA_EMAIL }}
        run: |
          set -euo pipefail

          # fetch DB password (impersonate run-api SA)
          DB_PASSWORD=$(gcloud secrets versions access latest \
            --secret=migrator \
            --impersonate-service-account="${RUN_API_SA_EMAIL}")

          # install goose deterministically
          GOOSE_VERSION="v3.15.0"
          GOPATH=$(go env GOPATH)
          go install github.com/pressly/goose/v3/cmd/goose@${GOOSE_VERSION}
          GOOSE="${GOPATH}/bin/goose"

          # sanity
          "$GOOSE" -version

          # run migrations (point to your real migrations dir)
          export DATABASE_URL="postgres://${DB_USER}:${DB_PASSWORD}@127.0.0.1:5432/${DB_NAME}?sslmode=disable"
          "$GOOSE" -dir ./luigi-mvp/api/migrations postgres "$DATABASE_URL" up

          # show status
          "$GOOSE" -dir ./luigi-mvp/api/migrations postgres "$DATABASE_URL" status
