version: "2"
sql:
  - engine: postgresql
    schema:
      - migrations
    queries:
      - internal/db/queries
    gen:
      go:
        package: db
        out: internal/db/sqlc
        sql_package: database/sql
        emit_json_tags: true
        emit_interface: true
        emit_params_struct_pointers: true
        emit_pointers_for_null_types: true  
        overrides:
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: "pg_catalog.interval"
            go_type: "string"
          - column: carts.status
            go_type: string
          - column: reservations.status
            go_type: string

