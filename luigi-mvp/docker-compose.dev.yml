services:
  postgres:
    image: postgres:17
    container_name: luigi-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - luigi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        GO_VERSION: 1.25.5
    container_name: luigi-api-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      PORT: 8080
      ENV: ${ENV}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID}
      # Google Firebase Auth
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/adc.json
    volumes:
    - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/adc.json:ro
    ports:
      - "8080:8080"

volumes:
  luigi-postgres-data:
