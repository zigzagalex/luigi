services:
  postgres:
    image: postgres:17
    container_name: luigi-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - luigi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        GO_VERSION: 1.25.5
    container_name: luigi-api-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      PORT: 8080
      ENV: ${ENV}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:3000}
      # Browser origins allowed to call the API with cookies (shop :3000, admin :3001).
      # Comma-separated; override in .env when ports/hosts differ.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "8080:8080"

volumes:
  luigi-postgres-data:
