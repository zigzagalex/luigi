# Production stack. Shop and admin dev servers stay on the laptop; this file
# is what a VPS runs. Images are pulled from GHCR. Only Caddy publishes ports.
#
#   docker compose --env-file /opt/luigi/.env up -d
#
# First admin: docker compose --env-file /opt/luigi/.env --profile seed run --rm seed
# That command does not replace an existing admin password.

name: luigi

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?set SHOP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?set MEDIA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - media
    depends_on:
      - api
      - web-shop
      - web-admin
      - seaweedfs
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luigi}
      POSTGRES_USER: ${POSTGRES_USER:-luigi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - luigi-postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luigi} -d ${POSTGRES_DB:-luigi}"]
      interval: 5s
      timeout: 5s
      retries: 20
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/luigi-api:${API_TAG:?set API_TAG}
    restart: "no"
    entrypoint: ["/goose"]
    command:
      - "-dir"
      - "/migrations"
      - "postgres"
      - "postgres://${POSTGRES_USER:-luigi}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-luigi}?sslmode=disable"
      - "up"
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    image: ghcr.io/${GHCR_OWNER}/luigi-api:${API_TAG}
    container_name: luigi-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-luigi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-luigi}?sslmode=disable
      PORT: "8080"
      ENV: prod
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      CORS_ORIGINS: https://${SHOP_DOMAIN},https://${ADMIN_DOMAIN}
      MEDIA_BASE_URL: https://${MEDIA_DOMAIN}/${S3_BUCKET:-luigi}
      SHOP_ID: ${SHOP_ID:-1}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-luigi}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
    networks:
      - edge
      - data
      - media
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  seaweedfs:
    image: chrislusf/seaweedfs:4.28
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/luigi/start-mini.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-luigi}
    volumes:
      - luigi-seaweed-data:/data
      - ./seaweed/start-mini.sh:/etc/luigi/start-mini.sh:ro
    networks:
      - media
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web-shop:
    image: ghcr.io/${GHCR_OWNER}/luigi-web-shop:${SHOP_TAG:?set SHOP_TAG}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080
      HOSTNAME: 0.0.0.0
      PORT: "8080"
    networks:
      - edge
    depends_on:
      - api
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web-admin:
    image: ghcr.io/${GHCR_OWNER}/luigi-web-admin:${ADMIN_TAG:?set ADMIN_TAG}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080
      HOSTNAME: 0.0.0.0
      PORT: "8080"
    networks:
      - edge
    depends_on:
      - api
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  seed:
    image: ghcr.io/${GHCR_OWNER}/luigi-api:${API_TAG}
    profiles: ["seed"]
    entrypoint: ["/seedadmin"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-luigi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-luigi}?sslmode=disable
      SHOP_ID: ${SHOP_ID:-1}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE:-+41000000000}
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  data:
    internal: true
  media:

volumes:
  luigi-postgres-data:
  luigi-seaweed-data:
  caddy-data:
  caddy-config:
